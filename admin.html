<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hidden Youth — Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #080808;
            color: #ffffff;
        }

        body {
            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           LOGIN
        ===================================================== */

        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background:
                radial-gradient(
                    circle at center,
                    rgba(100, 40, 180, 0.18),
                    transparent 45%
                ),
                #080808;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            background: rgba(18, 18, 18, 0.96);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-brand span {
            display: block;
            font-size: 11px;
            letter-spacing: 4px;
            opacity: 0.55;
            margin-bottom: 8px;
        }

        .login-brand h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 3px;
        }

        .login-brand h1 b {
            font-weight: 400;
            opacity: 0.55;
        }

        .login-form label {
            display: block;
            margin-bottom: 18px;
        }

        .login-form label span {
            display: block;
            margin-bottom: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            opacity: 0.55;
        }

        .login-form input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            outline: none;
            background: #111;
            color: #fff;
        }

        .login-form input:focus {
            border-color: rgba(170, 100, 255, 0.65);
        }

        .login-button {
            width: 100%;
            margin-top: 5px;
            padding: 15px;
            border: 0;
            border-radius: 9px;
            background: #fff;
            color: #000;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .login-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-error {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            color: #ff7777;
            font-size: 13px;
        }

        /* =====================================================
           ADMIN
        ===================================================== */

        .admin-app {
            display: none;
            min-height: 100vh;
        }

        .admin-app.active {
            display: block;
        }

        .admin-header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 8, 8, 0.94);
            backdrop-filter: blur(16px);
        }

        .admin-logo span {
            display: block;
            font-size: 9px;
            letter-spacing: 3px;
            opacity: 0.45;
            margin-bottom: 4px;
        }

        .admin-logo strong {
            font-size: 20px;
            letter-spacing: 2px;
        }

        .logout-button {
            padding: 9px 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: transparent;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .admin-container {
            width: min(1400px, calc(100% - 40px));
            margin: 0 auto;
            padding: 35px 0 70px;
        }

        /* =====================================================
           STATS
        ===================================================== */

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: #101010;
        }

        .stat-label {
            margin-bottom: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            opacity: 0.45;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
        }

        /* =====================================================
           TABS
        ===================================================== */

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tab {
            padding: 11px 17px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 8px;
            background: transparent;
            color: #aaa;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.7px;
        }

        .tab.active {
            background: #fff;
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            margin: 0 0 15px;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .tracking-row,
        .order,
        .product,
        .cart,
        .visitor {
            margin-bottom: 14px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: #101010;
        }

        .empty {
            padding: 45px 20px;
            text-align: center;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #888;
        }

        .empty h3 {
            margin: 0 0 8px;
            color: #fff;
        }

        .empty p {
            margin: 0;
        }

        /* =====================================================
           COMMON DETAILS
        ===================================================== */

        .visitor-top,
        .cart-top,
        .order-top,
        .product-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 16px;
        }

        .visitor-title,
        .cart-id,
        .order-id,
        .product-name {
            font-weight: 800;
        }

        .visitor-details,
        .cart-details,
        .order-details,
        .product-details {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .detail-label {
            margin-bottom: 5px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.3px;
            opacity: 0.45;
        }

        .detail-value {
            font-size: 13px;
            font-weight: 600;
            word-break: break-word;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .visitor-status,
        .order-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.7px;
        }

        .visitor-status.online {
            color: #8cff8c;
            background: rgba(80, 180, 80, 0.12);
            border: 1px solid rgba(100, 220, 100, 0.25);
        }

        .visitor-status.offline {
            color: #aaa;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }

        .online-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            background: #7cff7c;
            box-shadow:
                0 0 8px rgba(124, 255, 124, 0.7);
        }

        .status-PENDING {
            color: #ffd66b;
        }

        .status-CONFIRMED {
            color: #7cdfff;
        }

        .status-SHIPPED {
            color: #c59cff;
        }

        .status-DELIVERED {
            color: #7cff9b;
        }

        .status-CANCELLED {
            color: #ff7777;
        }

        /* =====================================================
           ORDER BUTTONS
        ===================================================== */

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .order-actions button {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 7px;
            background: transparent;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
        }

        /* =====================================================
           PRODUCTS
        ===================================================== */

        .product-image {
            width: 80px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            background: #181818;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .product-actions button {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 7px;
            background: transparent;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
        }

        /* =====================================================
           VISITOR DETAILS
        ===================================================== */

        .visitor-card {
            position: relative;
        }

        .visitor-details {
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
        }

        .visitor-icon {
            font-size: 18px;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 600px) {

            .admin-header {
                padding: 15px;
            }

            .admin-container {
                width: min(100% - 24px, 1400px);
                padding-top: 22px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .visitor-details,
            .cart-details,
            .order-details,
            .product-details {
                grid-template-columns: 1fr;
            }

            .login-box {
                padding: 28px 22px;
            }

        }
    </style>
</head>

<body>

    <!-- =====================================================
         LOGIN SCREEN
    ===================================================== -->

    <div
        class="login-screen"
        id="loginScreen"
    >

        <div class="login-box">

            <div class="login-brand">

                <span>
                    HIDDEN YOUTH
                </span>

                <h1>
                    ADMIN <b>PANEL</b>
                </h1>

            </div>

            <form
                class="login-form"
                id="loginForm"
            >

                <label>

                    <span>
                        USERNAME
                    </span>

                    <input
                        type="text"
                        id="adminUsername"
                        autocomplete="username"
                        required
                    >

                </label>

                <label>

                    <span>
                        PASSWORD
                    </span>

                    <input
                        type="password"
                        id="adminPassword"
                        autocomplete="current-password"
                        required
                    >

                </label>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    LOGIN
                </button>

                <div
                    class="login-error"
                    id="loginError"
                ></div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         ADMIN APP
    ===================================================== -->

    <div
        class="admin-app"
        id="adminApp"
    >

        <header class="admin-header">

            <div class="admin-logo">

                <span>
                    HIDDEN YOUTH
                </span>

                <strong>
                    ADMIN DASHBOARD
                </strong>

            </div>

            <button
                type="button"
                class="logout-button"
                id="logoutButton"
            >
                LOGOUT
            </button>

        </header>


        <main class="admin-container">

            <!-- =================================================
                 STATS
            ================================================= -->

            <section class="stats-grid">

                <div class="stat-card">

                    <div class="stat-label">
                        TOTAL ORDERS
                    </div>

                    <div
                        class="stat-value"
                        id="totalOrders"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        PENDING ORDERS
                    </div>

                    <div
                        class="stat-value"
                        id="pendingOrders"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        CONFIRMED ORDERS
                    </div>

                    <div
                        class="stat-value"
                        id="confirmedOrders"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        TOTAL SALES
                    </div>

                    <div
                        class="stat-value"
                        id="totalSales"
                    >
                        Rs. 0
                    </div>

                </div>

            </section>


            <!-- =================================================
                 TABS
            ================================================= -->

            <nav class="tabs">

                <button
                    class="tab active"
                    data-tab="orders"
                    type="button"
                >
                    ORDERS
                </button>

                <button
                    class="tab"
                    data-tab="products"
                    type="button"
                >
                    PRODUCTS
                </button>

                <button
                    class="tab"
                    data-tab="visitors"
                    type="button"
                >
                    LIVE VISITORS
                </button>

                <button
                    class="tab"
                    data-tab="carts"
                    type="button"
                >
                    ACTIVE CARTS
                </button>

            </nav>


            <!-- =================================================
                 ORDERS
            ================================================= -->

            <section
                class="tab-content active"
                id="ordersTab"
            >

                <h2 class="section-title">
                    ORDERS
                </h2>

                <div id="ordersContainer">

                    <div class="empty">
                        Loading orders...
                    </div>

                </div>

            </section>


            <!-- =================================================
                 PRODUCTS
            ================================================= -->

            <section
                class="tab-content"
                id="productsTab"
            >

                <h2 class="section-title">
                    PRODUCTS
                </h2>

                <div id="productsContainer">

                    <div class="empty">
                        Loading products...
                    </div>

                </div>

            </section>


            <!-- =================================================
                 LIVE VISITORS
            ================================================= -->

            <section
                class="tab-content"
                id="visitorsTab"
            >

                <h2 class="section-title">
                    LIVE VISITORS
                </h2>

                <div id="visitorsContainer">

                    <div class="empty">
                        Loading live visitors...
                    </div>

                </div>

            </section>


            <!-- =================================================
                 ACTIVE CARTS
            ================================================= -->

            <section
                class="tab-content"
                id="cartsTab"
            >

                <h2 class="section-title">
                    ACTIVE CARTS
                </h2>

                <div id="cartsContainer">

                    <div class="empty">
                        Loading active carts...
                    </div>

                </div>

            </section>

        </main>

    </div> 
        <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           API
        ===================================================== */

        const API_URL =
            "https://hidden-youth-backend-production.up.railway.app";


        /* =====================================================
           ADMIN AUTH
        ===================================================== */

        let adminToken =
            localStorage.getItem(
                "hiddenYouthAdminToken"
            );


        const loginScreen =
            document.getElementById(
                "loginScreen"
            );

        const adminApp =
            document.getElementById(
                "adminApp"
            );

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const loginError =
            document.getElementById(
                "loginError"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           MONEY
        ===================================================== */

        function formatMoney(value) {

            return (
                "Rs. " +
                Number(
                    value || 0
                ).toLocaleString()
            );

        }


        /* =====================================================
           SHOW ADMIN
        ===================================================== */

        function showAdmin() {

            if (loginScreen) {

                loginScreen.style.display =
                    "none";

            }

            if (adminApp) {

                adminApp.classList.add(
                    "active"
                );

            }

            loadDashboard();

        }


        /* =====================================================
           SHOW LOGIN
        ===================================================== */

        function showLogin() {

            if (adminApp) {

                adminApp.classList.remove(
                    "active"
                );

            }

            if (loginScreen) {

                loginScreen.style.display =
                    "flex";

            }

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        if (loginForm) {

            loginForm.addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const username =
                        document.getElementById(
                            "adminUsername"
                        ).value.trim();

                    const password =
                        document.getElementById(
                            "adminPassword"
                        ).value;

                    if (
                        !username ||
                        !password
                    ) {

                        loginError.textContent =
                            "ENTER USERNAME AND PASSWORD.";

                        return;

                    }


                    loginButton.disabled =
                        true;

                    loginButton.textContent =
                        "LOGGING IN...";

                    loginError.textContent =
                        "";


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/api/admin/login`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            username:
                                                username,
                                            password:
                                                password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            throw new Error(
                                data.message ||
                                "LOGIN FAILED"
                            );

                        }


                        adminToken =
                            data.token ||
                            data.accessToken ||
                            data.adminToken;


                        if (!adminToken) {

                            throw new Error(
                                "LOGIN TOKEN NOT RECEIVED."
                            );

                        }


                        localStorage.setItem(
                            "hiddenYouthAdminToken",
                            adminToken
                        );


                        showAdmin();


                    } catch (error) {

                        console.error(
                            "ADMIN LOGIN ERROR:",
                            error
                        );

                        loginError.textContent =
                            error.message ||
                            "LOGIN FAILED.";

                    } finally {

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "LOGIN";

                    }

                }
            );

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        if (logoutButton) {

            logoutButton.addEventListener(
                "click",
                function() {

                    localStorage.removeItem(
                        "hiddenYouthAdminToken"
                    );

                    adminToken =
                        null;

                    showLogin();

                }
            );

        }


        /* =====================================================
           AUTH HEADERS
        ===================================================== */

        function authHeaders() {

            return {

                "Content-Type":
                    "application/json",

                "Authorization":
                    `Bearer ${adminToken}`

            };

        }


        /* =====================================================
           API REQUEST
        ===================================================== */

        async function adminFetch(
            endpoint,
            options = {}
        ) {

            const config = {
                ...options,
                headers: {
                    ...authHeaders(),
                    ...(options.headers || {})
                }
            };


            const response =
                await fetch(
                    `${API_URL}${endpoint}`,
                    config
                );


            if (
                response.status ===
                401
            ) {

                localStorage.removeItem(
                    "hiddenYouthAdminToken"
                );

                adminToken =
                    null;

                showLogin();

                throw new Error(
                    "ADMIN SESSION EXPIRED."
                );

            }


            return response;

        }


        /* =====================================================
           LOAD DASHBOARD
        ===================================================== */

        async function loadDashboard() {

            await Promise.allSettled([

                loadOrders(),

                loadProducts(),

                loadVisitors(),

                loadActiveCarts()

            ]);

        }


        /* =====================================================
           ORDERS
        ===================================================== */

        let orders = [];


        async function loadOrders() {

            const container =
                document.getElementById(
                    "ordersContainer"
                );


            try {

                const response =
                    await adminFetch(
                        "/api/orders"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "ORDERS FAILED"
                    );

                }


                orders =
                    Array.isArray(
                        data.orders
                    )
                        ? data.orders
                        : [];


                renderOrders();

                updateStats(
                    orders
                );


            } catch (error) {

                console.error(
                    "ORDERS ERROR:",
                    error
                );


                if (container) {

                    container.innerHTML = `
                        <div class="empty">
                            <h3>
                                ORDERS COULD NOT LOAD
                            </h3>
                            <p>
                                ${escapeHTML(
                                    error.message
                                )}
                            </p>
                        </div>
                    `;

                }

            }

        }


        /* =====================================================
           UPDATE STATS
        ===================================================== */

        function updateStats(
            orderList
        ) {

            const total =
                orderList.length;


            const pending =
                orderList.filter(
                    function(order) {

                        return String(
                            order.status ||
                            ""
                        ).toUpperCase()
                            === "PENDING";

                    }
                ).length;


            const confirmed =
                orderList.filter(
                    function(order) {

                        return String(
                            order.status ||
                            ""
                        ).toUpperCase()
                            === "CONFIRMED";

                    }
                ).length;


            /*
             * IMPORTANT:
             * TOTAL SALES ONLY COUNTS
             * DELIVERED ORDERS.
             */

            const sales =
                orderList
                    .filter(
                        function(order) {

                            return String(
                                order.status ||
                                ""
                            ).toUpperCase()
                                === "DELIVERED";

                        }
                    )
                    .reduce(
                        function(
                            sum,
                            order
                        ) {

                            return (
                                sum +
                                Number(
                                    order.total ||
                                    0
                                )
                            );

                        },
                        0
                    );


            const totalOrders =
                document.getElementById(
                    "totalOrders"
                );

            const pendingOrders =
                document.getElementById(
                    "pendingOrders"
                );

            const confirmedOrders =
                document.getElementById(
                    "confirmedOrders"
                );

            const totalSales =
                document.getElementById(
                    "totalSales"
                );


            if (totalOrders) {

                totalOrders.textContent =
                    total;

            }


            if (pendingOrders) {

                pendingOrders.textContent =
                    pending;

            }


            if (confirmedOrders) {

                confirmedOrders.textContent =
                    confirmed;

            }


            if (totalSales) {

                totalSales.textContent =
                    formatMoney(
                        sales
                    );

            }

        }


        /* =====================================================
           RENDER ORDERS
        ===================================================== */

        function renderOrders() {

            const container =
                document.getElementById(
                    "ordersContainer"
                );


            if (!container) {

                return;

            }


            if (
                !orders ||
                orders.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">

                                <div class="order-details">

                                            CUSTOMER
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHTML(
                                                customer.name ||

                                            )}
                                        </div>

                                    </div>


                                    <div class="detail">

                                        <div class="detail-label">
                                            PHONE
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHTML(
                                                customer.phone ||
                                                order.phone ||
                                                "—"
                                            )}
                                        </div>

                                    </div>


                                    <div class="detail">

                                        <div class="detail-label">
                                            CITY
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHTML(
                                                customer.city ||
                                                order.city ||
                                                "—"
                                            )}
                                        </div>

                                    </div>


                                    <div class="detail">

                                        <div class="detail-label">
                                            TOTAL
                                        </div>

                                        <div class="detail-value">
                                            ${formatMoney(
                                                order.total
                                            )}
                                        </div>

                                    <div class="detail">

        /* =====================================================
           UPDATE ORDER STATUS
        ===================================================== */

        async function updateOrderStatus(
            orderId,
            status
        ) {

            try {

                const response =
                    await adminFetch(
                        `/api/orders/${encodeURIComponent(
                            orderId
                        )}`,
                        {
                            method: "PATCH",

                            body:
                                JSON.stringify({
                                    status:
                                        status
                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "STATUS UPDATE FAILED"
                    );

                }


                await loadOrders();


            } catch (error) {

                console.error(
                    "STATUS UPDATE ERROR:",
                    error
                );

                alert(
                    error.message ||
                    "STATUS UPDATE FAILED."
                );

            }

        }


        /* =====================================================
           PRODUCTS
        ===================================================== */

        let products = [];


        async function loadProducts() {

            const container =
                document.getElementById(
                    "productsContainer"
                );


            try {

                const response =
                    await adminFetch(
                        "/api/products"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "PRODUCTS FAILED"
                    );

                }


                products =
                    Array.isArray(
                        data.products
                    )
                        ? data.products
                        : [];


                renderProducts();


            } catch (error) {

                console.error(
                    "PRODUCTS ERROR:",
                    error
                );


                if (container) {

                    container.innerHTML = `
                        <div class="empty">
                            <h3>
                                PRODUCTS COULD NOT LOAD
                            </h3>
                            <p>
                                ${escapeHTML(
                                    error.message
                                )}
                            </p>
                        </div>
                    `;

                }

            }

        }


        function renderProducts() {

            const container =
                document.getElementById(
                    "productsContainer"
                );


            if (!container) {

                return;

            }


            if (
                !products ||
                products.length === 0
            ) {

                container.innerHTML = `

                        <h3>
                            NO PRODUCTS

                            Products will appear here.
                        </p>
                    </div>
                `;

            }


            container.innerHTML =
                products.map(
                    function(product) {

                        return `

                            <div class="product">

                                <div class="product-top">

                                    <div>

                                        <div class="product-name">
                                            ${escapeHTML(
                                                product.name ||
                                                "Product"
                                            )}
                                        </div>

                                        <div
                                            style="
                                                margin-top:6px;
                                                opacity:.55;
                                                font-size:11px;
                                            "
                                        >
                                            ID:
                                            ${escapeHTML(
                                                String(
                                                    product.id ||
                                                    product._id ||
                                                    "—"
                                                )
                                            )}
                                        </div>

                                    </div>

                                        ${formatMoney(

                                    </strong>

                                </div>


                                <div class="product-details">

                                            ${escapeHTML(
                                                product.category ||

        /* =====================================================
           LIVE VISITORS
        ===================================================== */

        let visitorRefreshTimer =
            null;


        async function loadVisitors() {

            const container =
                document.getElementById(
                    "visitorsContainer"
                );


            if (!container) {

                return;

            }


            try {

                const response =
                    await adminFetch(
                        "/api/visitors"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "VISITORS FAILED"
                    );

                }


                const visitors =
                    Array.isArray(
                        data.visitors
                    )
                        ? data.visitors
                        : [];


                renderVisitors(
                    visitors
                );


            } catch (error) {

                console.error(
                    "VISITORS ERROR:",
                    error
                );

                container.innerHTML = `
                    <div class="empty">
                        <h3>
                            LIVE VISITORS COULD NOT LOAD
                        </h3>
                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>
                    </div>
                `;

            }

        }


        function createVisitorHTML(
            visitor
        ) {

            const visitorId =
                visitor.visitor_id ||
                visitor.visitorId ||
                "Visitor";


            const page =
                visitor.page ||
                "/";


            const userAgent =
                visitor.user_agent ||
                visitor.userAgent ||
                "";


            const lastSeen =
                visitor.last_seen ||
                visitor.lastSeen ||
                visitor.created_at ||
                visitor.createdAt ||
                null;


            let device =
                "Desktop";


            if (
                /iPad|Tablet/i.test(
                    userAgent
                )
            ) {

                device =
                    "Tablet";

            } else if (
                /Mobile|Android|iPhone|iPod/i.test(
                    userAgent
                )
            ) {

                device =
                    "Mobile";

            }


            let browser =
                "Unknown";


            if (
                /Edg\//i.test(
                    userAgent
                )
            ) {

                browser =
                    "Microsoft Edge";

            } else if (
                /OPR\//i.test(
                    userAgent
                )
            ) {

                browser =
                    "Opera";

            } else if (
                /Chrome\//i.test(
                    userAgent
                )
            ) {

                browser =
                    "Google Chrome";

            } else if (
                /Firefox\//i.test(
                    userAgent
                )
            ) {

                browser =
                    "Mozilla Firefox";

            } else if (
                /Safari\//i.test(
                    userAgent
                ) &&
                !/Chrome\//i.test(
                    userAgent
                )
            ) {

                browser =
                    "Safari";

            }


            let lastSeenText =
                "—";


            if (lastSeen) {

                const date =
                    new Date(
                        lastSeen
                    );


                if (
                    !Number.isNaN(
                        date.getTime()
                    )
                ) {

                    lastSeenText =
                        date.toLocaleString();

                }

            }


            let isOnline =
                false;


            if (lastSeen) {

                const lastSeenTime =
                    new Date(
                        lastSeen
                    ).getTime();


                if (
                    !Number.isNaN(
                        lastSeenTime
                    )
                ) {

                    isOnline =
                        Date.now() -
                        lastSeenTime <=
                        60000;

                }

            }


            const statusHTML =
                isOnline
                    ? `
                        <span class="visitor-status online">
                            <span class="online-dot"></span>
                            ONLINE
                        </span>
                    `
                    : `
                        <span class="visitor-status offline">
                            OFFLINE
                        </span>
                    `;


            return `

                <div class="tracking-row visitor-card">

                    <div class="visitor-top">

                        <div class="visitor-title">

                            <span class="visitor-icon">
                                👤
                            </span>

                            <strong>
                                ${escapeHTML(
                                    String(
                                        visitorId
                                    )
                                )}
                            </strong>

                            ${statusHTML}

                        </div>

                    </div>


                    <div class="visitor-details">

                        <div class="detail">

                            <div class="detail-label">
                                PAGE
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    String(
                                        page
                                    )
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                DEVICE
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    device
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                BROWSER
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    browser
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                LAST SEEN
                            </div>

                            <div class="detail-value">
                                ${escapeHTML(
                                    lastSeenText
                                )}
                            </div>

                        </div>

                    </div>

                </div>

            `;

        }


        function renderVisitors(
            visitors
        ) {

            const container =
                document.getElementById(
                    "visitorsContainer"
                );


            if (!container) {

                return;

            }


            if (
                !visitors ||
                visitors.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        <h3>
                            NO LIVE VISITORS
                        </h3>
                        <p>
                            Visitors will appear here.
                        </p>
                    </div>
                `;

                return;

            }


            container.innerHTML =
                visitors
                    .map(
                        createVisitorHTML
                    )
                    .join("");

        }


        /* =====================================================
           ACTIVE CARTS
        ===================================================== */

        async function loadActiveCarts() {

            const container =
                document.getElementById(
                    "cartsContainer"
                );


            if (!container) {

                return;

            }


            try {

                const response =
                    await adminFetch(
                        "/api/carts/active"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "ACTIVE CARTS FAILED"
                    );

                }


                const carts =
                    Array.isArray(
                        data.carts
                    )
                        ? data.carts
                        : [];


                renderActiveCarts(
                    carts
                );


            } catch (error) {

                console.error(
                    "ACTIVE CARTS ERROR:",
                    error
                );


                if (container) {

                    container.innerHTML = `
                        <div class="empty">
                            <h3>
                                ACTIVE CARTS COULD NOT LOAD
                            </h3>
                            <p>
                                ${escapeHTML(
                                    error.message
                                )}
                            </p>
                        </div>
                    `;

                }

            }

        }


        function renderActiveCarts(
            carts
        ) {

            const container =
                document.getElementById(
                    "cartsContainer"
                );


            if (!container) {

                return;

            }


            if (
                !carts ||
                carts.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        <h3>
                            NO ACTIVE CARTS
                        </h3>
                        <p>
                            Active customer carts will appear here.
                        </p>
                    </div>
                `;

                return;

            }


            container.innerHTML =
                carts.map(
                    function(cart) {

                        const visitorId =
                            cart.visitor_id ||
                            cart.visitorId ||
                            cart.id ||
                            "Visitor";


                        const items =
                            Array.isArray(
                                cart.items
                            )
                                ? cart.items
                                : [];


                        const total =
                            items.reduce(
                                function(
                                    sum,
                                    item
                                ) {

                                    return (
                                        sum +
                                        Number(
                                            item.price ||
                                            0
                                        ) *
                                        Number(
                                            item.quantity ||
                                            1
                                        )
                                    );

                                },
                                0
                            );


                        return `

                            <div class="cart">

                                <div class="cart-top">

                                    <div>

                                        <div class="cart-id">
                                            👤
                                            ${escapeHTML(
                                                String(
                                                    visitorId
                                                )
                                            )}
                                        </div>

                                    </div>

                                    <strong>
                                        ${formatMoney(
                                            total
                                        )}
                                    </strong>

                                </div>


                                <div class="cart-details">

                                    <div class="detail">

                                        <div class="detail-label">
                                            ITEMS
                                        </div>

                                        <div class="detail-value">
                                            ${items.length}
                                        </div>

                                    </div>


                                    <div class="detail">

                                        <div class="detail-label">
                                            CART TOTAL
                                        </div>

                                        <div class="detail-value">
                                            ${formatMoney(
                                                total
                                            )}
                                        </div>

                                    </div>

                                </div>

                            </div>

                        `;

                    }
                ).join("");

        }


        /* =====================================================
           TAB SYSTEM
        ===================================================== */

        const tabs =
            document.querySelectorAll(
                ".tab"
            );


        tabs.forEach(
            function(tab) {

                tab.addEventListener(
                    "click",
                    function() {

                        const target =
                            tab.dataset.tab;


                        tabs.forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        tab.classList.add(
                            "active"
                        );


                        document
                            .querySelectorAll(
                                ".tab-content"
                            )
                            .forEach(
                                function(section) {

                                    section.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        const targetSection =
                            document.getElementById(
                                `${target}Tab`
                            );


                        if (targetSection) {

                            targetSection.classList.add(
                                "active"
                            );

                        }


                        if (
                            target ===
                            "visitors"
                        ) {

                            loadVisitors();

                        }


                        if (
                            target ===
                            "carts"
                        ) {

                            loadActiveCarts();

                        }

                    }
                );

            }
        );


        /* =====================================================
           LIVE REFRESH
        ===================================================== */

        async function refreshLiveData() {

            try {

                await Promise.allSettled([

                    loadVisitors(),

                    loadActiveCarts()

                ]);

            } catch (error) {

                console.error(
                    "LIVE REFRESH ERROR:",
                    error
                );

            }

        }


        function startLiveRefresh() {

            if (
                visitorRefreshTimer
            ) {

                clearInterval(
                    visitorRefreshTimer
                );

            }


            visitorRefreshTimer =
                setInterval(
                    function() {

                        if (
                            document.visibilityState ===
                            "visible" &&
                            adminToken
                        ) {

                            refreshLiveData();

                        }

                    },
                    10000
                );

        }


        /* =====================================================
           INITIAL AUTH CHECK
        ===================================================== */

        window.addEventListener(
            "load",
            function() {

                if (adminToken) {

                    showAdmin();

                } else {

                    showLogin();

                }

                startLiveRefresh();

            }
        );


        /* =====================================================
           VISIBILITY REFRESH
        ===================================================== */

        document.addEventListener(
            "visibilitychange",
            function() {

                if (
                    document.visibilityState ===
                    "visible" &&
                    adminToken
                ) {

                    refreshLiveData();

                }

            }
        );

    </script> 
    </body>
</html>
