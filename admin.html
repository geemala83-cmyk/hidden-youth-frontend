<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Hidden Youth — Admin Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: #fff;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: min(1200px, 94%);
    margin: auto;
    padding: 30px 0 60px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.brand {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 6px;
    color: #999;
    font-size: 14px;
}

.refresh-btn {
    border: 0;
    background: #fff;
    color: #000;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 700;
}

.refresh-btn:hover {
    opacity: .85;
}


/* =====================================================
   STATS
===================================================== */

.stats {
    display: grid;
    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
}

.stat-label {
    color: #888;
    font-size: 12px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 27px;
    font-weight: 800;
}


/* =====================================================
   TABS
===================================================== */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.tab {
    border: 1px solid #333;
    background: #151515;
    color: #aaa;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 700;
}

.tab.active {
    background: #fff;
    color: #000;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    background: #151515;
    border: 1px solid #292929;
    color: #aaa;
}


/* =====================================================
   PANELS
===================================================== */

.panel {
    display: none;
}

.panel.active {
    display: block;
}


/* =====================================================
   ORDERS
===================================================== */

.orders {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.order {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 22px;
}

.order-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.order-id {
    font-size: 18px;
    font-weight: 800;
}

.order-date {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

.badge {
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    background: #252525;
}

.customer {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
    margin-bottom: 20px;
}

.info {
    background: #101010;
    border-radius: 8px;
    padding: 12px;
}

.info-label {
    color: #777;
    font-size: 11px;
    margin-bottom: 5px;
    text-transform: uppercase;
}

.info-value {
    font-size: 14px;
    word-break: break-word;
}

.items {
    border-top: 1px solid #292929;
    border-bottom: 1px solid #292929;
    padding: 15px 0;
    margin-bottom: 18px;
}

.item {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 8px 0;
}

.item-name {
    font-weight: 700;
}

.item-meta {
    color: #888;
    font-size: 12px;
    margin-top: 4px;
}

.item-price {
    font-weight: 700;
    white-space: nowrap;
}

.order-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.total {
    font-size: 20px;
    font-weight: 800;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.action-btn {
    border: 1px solid #444;
    background: #202020;
    color: #fff;
    padding: 9px 13px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
}

.action-btn:hover {
    background: #303030;
}


/* =====================================================
   PRODUCTS
===================================================== */

.products-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 18px;
}

.product-card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    overflow: hidden;
}

.product-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #101010;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    padding: 16px;
}

.product-name {
    font-size: 16px;
    font-weight: 800;
}

.product-category {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

.product-price {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 800;
}

.product-stock {
    margin-top: 6px;
    font-size: 12px;
    color: #aaa;
}

.product-actions {
    display: flex;
    gap: 8px;
    padding: 0 16px 16px;
    flex-wrap: wrap;
}


/* =====================================================
   VISITORS / CARTS
===================================================== */

.visitors,
.carts {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.visitor,
.cart {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 16px;
}

.visitor-top,
.cart-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.visitor-id,
.cart-id {
    font-weight: 800;
}

.visitor-time,
.cart-time {
    color: #777;
    font-size: 12px;
}

.visitor-details,
.cart-details {
    margin-top: 12px;
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 10px;
}

.detail {
    background: #101010;
    border-radius: 8px;
    padding: 10px;
}

.detail-label {
    color: #777;
    font-size: 10px;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.detail-value {
    font-size: 13px;
    word-break: break-word;
}


/* =====================================================
   LIVE VISITOR STATUS
===================================================== */

.visitor-title {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
}

.visitor-icon {
    font-size: 18px;
}

.visitor-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;
}

.visitor-status.online {
    color: #8cff8c;
    background: rgba(80,180,80,.12);
    border: 1px solid rgba(100,220,100,.25);
}

.visitor-status.offline {
    color: #aaa;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.10);
}

.online-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7cff7c;
    display: inline-block;
    box-shadow:
        0 0 8px rgba(124,255,124,.7);
}


/* =====================================================
   FORMS
===================================================== */

.form-box {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    color: #888;
    font-size: 11px;
    text-transform: uppercase;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    border: 1px solid #333;
    background: #0f0f0f;
    color: #fff;
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

.form-group textarea {
    min-height: 90px;
    resize: vertical;
}

.form-submit {
    margin-top: 15px;
    border: 0;
    background: #fff;
    color: #000;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: 800;
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty {
    text-align: center;
    padding: 60px 20px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    color: #777;
}

.empty h3 {
    color: #aaa;
    margin-bottom: 8px;
}

.empty p {
    margin: 0;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #888;
}


/* =====================================================
   LOGIN
===================================================== */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: min(420px,100%);
    background: #151515;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 30px;
}

.login-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 6px;
}

.login-subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    margin-bottom: 12px;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0e0e0e;
    color: #fff;
}

.login-box button {
    width: 100%;
    border: 0;
    background: #fff;
    color: #000;
    padding: 13px;
    border-radius: 8px;
    font-weight: 800;
}

.login-error {
    color: #ff7777;
    font-size: 13px;
    margin-top: 12px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width:1000px) {

    .stats {
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .products-grid {
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

@media (max-width:700px) {

    .stats {
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .customer,
    .visitor-details,
    .cart-details,
    .form-grid {
        grid-template-columns:1fr;
    }

    .form-group.full {
        grid-column:auto;
    }

}

@media (max-width:500px) {

    .stats {
        grid-template-columns:1fr;
    }

    .products-grid {
        grid-template-columns:1fr;
    }

    .brand {
        font-size:22px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div
    id="loginScreen"
    class="login-screen"
>

    <div class="login-box">

        <div class="login-title">
            HIDDEN YOUTH
        </div>

        <div class="login-subtitle">
            Admin Dashboard
        </div>

        <form id="loginForm">

            <input
                type="text"
                id="adminUsername"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

        <div
            class="login-error"
            id="loginError"
        ></div>

    </div>

</div>


<!-- =====================================================
     ADMIN APP
===================================================== -->

<div
    id="adminApp"
    style="display:none;"
>

<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div>

        <div class="brand">
            HIDDEN YOUTH
        </div>

        <div class="subtitle">
            Admin Dashboard
        </div>

    </div>

    <button
        class="refresh-btn"
        id="refreshBtn"
        type="button"
    >
        ↻ REFRESH
    </button>

</div>


<!-- =====================================================
     STATS
===================================================== -->

<div class="stats">

    <div class="stat">

        <div class="stat-label">
            TOTAL ORDERS
        </div>

        <div
            class="stat-value"
            id="totalOrders"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            PENDING
        </div>

        <div
            class="stat-value"
            id="pendingOrders"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            CONFIRMED
        </div>

        <div
            class="stat-value"
            id="confirmedOrders"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            TOTAL SALES
        </div>

        <div
            class="stat-value"
            id="totalSales"
        >
            Rs. 0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            LIVE VISITORS
        </div>

        <div
            class="stat-value"
            id="liveVisitors"
        >
            0
        </div>

    </div>

</div>


<div
    class="status"
    id="statusMessage"
>
    Loading dashboard...
</div>


<!-- =====================================================
     TABS
===================================================== -->

<div class="tabs">

    <button
        class="tab active"
        data-tab="orders"
        type="button"
    >
        ORDERS
    </button>

    <button
        class="tab"
        data-tab="products"
        type="button"
    >
        PRODUCTS
    </button>

    <button
        class="tab"
        data-tab="visitors"
        type="button"
    >
        LIVE VISITORS
    </button>

    <button
        class="tab"
        data-tab="carts"
        type="button"
    >
        ACTIVE CARTS
    </button>

</div>


<!-- =====================================================
     ORDERS
===================================================== -->

<section
    class="panel active"
    id="ordersPanel"
>

    <div
        class="orders"
        id="ordersContainer"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>

</section>


<!-- =====================================================
     PRODUCTS
===================================================== -->

<section
    class="panel"
    id="productsPanel"
>

    <div class="form-box">

        <h2>
            ADD PRODUCT
        </h2>

        <form id="productForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Name
                    </label>

                    <input
                        id="productName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        id="productCategory"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Stock
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        min="0"
                        value="0"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="productDescription"
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label>
                        Image URL
                    </label>

                    <input
                        id="productImage"
                    >

                </div>

            </div>


            <button
                class="form-submit"
                type="submit"
            >
                ADD PRODUCT
            </button>

        </form>

    </div>


    <div
        class="products-grid"
        id="productsContainer"
    >

        <div class="loading">
            Loading products...
        </div>

    </div>

</section>


<!-- =====================================================
     LIVE VISITORS
===================================================== -->

<section
    class="panel"
    id="visitorsPanel"
>

    <div
        class="visitors"
        id="visitorsContainer"
    >

        <div class="loading">
            Loading visitors...
        </div>

    </div>

</section>


<!-- =====================================================
     ACTIVE CARTS
===================================================== -->

<section
    class="panel"
    id="cartsPanel"
>

    <div
        class="carts"
        id="cartsContainer"
    >

        <div class="loading">
            Loading active carts...
        </div>

    </div>

</section>


</div>

</div>


<script>

/* =====================================================
   BACKEND
===================================================== */

const API_URL =
    "https://hidden-youth-backend-production.up.railway.app";


let adminToken =
    localStorage.getItem(
        "hiddenYouthAdminToken"
    ) || "";


/* =====================================================
   AUTH HEADERS
===================================================== */

function authHeaders() {

    if (!adminToken) {
        return {};
    }

    return {
        Authorization:
            `Bearer ${adminToken}`
    };
}


/* =====================================================
   API REQUEST
===================================================== */

async function apiRequest(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            {
                ...options,

                cache:
                    "no-store",

                headers: {

                    ...authHeaders(),

                    "Cache-Control":
                        "no-cache",

                    "Pragma":
                        "no-cache",

                    ...(options.headers || {})
                }
            }
        );


    let data = {};

    try {

        data =
            await response.json();

    } catch {

        data = {};

    }


    if (
        response.status === 401
    ) {

        localStorage.removeItem(
            "hiddenYouthAdminToken"
        );

        adminToken = "";

        showLogin();

        throw new Error(
            "Admin session expired."
        );
    }


    if (!response.ok) {

        throw new Error(
            data.message ||
            "Request failed."
        );
    }


    return data;
}


/* =====================================================
   LOGIN
===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginError =
    document.getElementById(
        "loginError"
    );


if (loginForm) {

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById(
                        "adminUsername"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "adminPassword"
                    )
                    .value;


            loginError.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/admin/login`,
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username,
                                    password
                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Login failed."
                    );
                }


                adminToken =
                    data.token;


                localStorage.setItem(
                    "hiddenYouthAdminToken",
                    adminToken
                );


                loginError.textContent =
                    "";


                await showAdmin();


                startLiveRefresh();


            } catch(error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                loginError.textContent =
                    error.message ||
                    "Invalid login.";
            }

        }
    );

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

    const loginScreen =
        document.getElementById(
            "loginScreen"
        );

    const adminApp =
        document.getElementById(
            "adminApp"
        );


    if (loginScreen) {

        loginScreen.style.display =
            "flex";
    }


    if (adminApp) {

        adminApp.style.display =
            "none";
    }
}


/* =====================================================
   SHOW ADMIN
===================================================== */

async function showAdmin() {

    const loginScreen =
        document.getElementById(
            "loginScreen"
        );

    const adminApp =
        document.getElementById(
            "adminApp"
        );


    if (loginScreen) {

        loginScreen.style.display =
            "none";
    }


    if (adminApp) {

        adminApp.style.display =
            "block";
    }


    await refreshAll();
}


/* =====================================================
   TABS
===================================================== */

document
    .querySelectorAll(".tab")
    .forEach(
        function(tab) {

            tab.addEventListener(
                "click",
                async function() {

                    document
                        .querySelectorAll(".tab")
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    document
                        .querySelectorAll(".panel")
                        .forEach(
                            function(panel) {

                                panel.classList.remove(
                                    "active"
                                );

                            }
                        );


                    tab.classList.add(
                        "active"
                    );


                    const tabName =
                        tab.dataset.tab;


                    const panel =
                        document.getElementById(
                            `${tabName}Panel`
                        );


                    if (panel) {

                        panel.classList.add(
                            "active"
                        );
                    }


                    if (
                        tabName ===
                        "orders"
                    ) {

                        await loadOrders();

                    }


                    if (
                        tabName ===
                        "products"
                    ) {

                        await loadProducts();

                    }


                    if (
                        tabName ===
                        "visitors"
                    ) {

                        await loadVisitors();

                    }


                    if (
                        tabName ===
                        "carts"
                    ) {

                        await loadCarts();

                    }

                }
            );

        }
    );


/* =====================================================
   REFRESH ALL
===================================================== */

async function refreshAll() {

    await Promise.all([
        loadDashboard(),
        loadProducts(),
        loadOrders(),
        loadVisitors(),
        loadCarts()
    ]);

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


if (refreshBtn) {

    refreshBtn.addEventListener(
        "click",
        async function() {

            refreshBtn.disabled =
                true;

            refreshBtn.textContent =
                "↻ REFRESHING...";


            try {

                await refreshAll();

            } catch(error) {

                console.error(
                    "REFRESH ERROR:",
                    error
                );

            } finally {

                refreshBtn.disabled =
                    false;

                refreshBtn.textContent =
                    "↻ REFRESH";
            }

/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(
    orders
) {

    const total =
        orders.length;


    const pending =
        orders.filter(
            order =>
                order.status ===
                "PENDING"
        ).length;


    const confirmed =
        orders.filter(
            order =>
                order.status ===
                "CONFIRMED"
        ).length;


    const sales =
        orders.reduce(
            function(
                sum,
                order
            ) {

                return (
                    sum +
                    Number(
                        order.total ||
                        0
                    )
                );

            },
            0
        );


    const totalOrders =
        document.getElementById(
            "totalOrders"
        );


    const pendingOrders =
        document.getElementById(
            "pendingOrders"
        );


    const confirmedOrders =
        document.getElementById(
            "confirmedOrders"
        );


    const totalSales =
        document.getElementById(
            "totalSales"
        );


    if (totalOrders) {

        totalOrders.textContent =
            total;
    }


    if (pendingOrders) {

        pendingOrders.textContent =
            pending;
    }


    if (confirmedOrders) {

        confirmedOrders.textContent =
            confirmed;
    }


    if (totalSales) {

        totalSales.textContent =
            formatMoney(
                sales
            );
    }

}


/* =====================================================
   LIVE VISITOR COUNT
===================================================== */

function updateLiveVisitorCount(
    visitors
) {

    const element =
        document.getElementById(
            "liveVisitors"
        );


    if (!element) {
        return;
    }


    const now =
        Date.now();


    const activeVisitors =
        visitors.filter(
            function(visitor) {

                const lastSeen =
                    new Date(
                        visitor.last_seen ||
                        visitor.created_at ||
                        0
                    ).getTime();


                return (
                    lastSeen > 0 &&
                    now - lastSeen <=
                    60000
                );

            }
        );


    element.textContent =
        activeVisitors.length;
}

/* =====================================================

===================================================== */

function createStatusButtons(
    order
) {

    const current =
        order.status ||
        "PENDING";


    let buttons = "";


    if (
        current !==
        "CONFIRMED"
    ) {

        buttons += `

            <button
                class="action-btn"
                onclick="changeStatus(
                    '${escapeJS(
                        order.id
                    )}',
                    'CONFIRMED'
                )"
            >
                CONFIRM
            </button>

        `;
    }


    if (
        current !==
        "SHIPPED"
    ) {

        buttons += `

            <button
                class="action-btn"
                onclick="changeStatus(
                    '${escapeJS(
                        order.id
                    )}',
                    'SHIPPED'
                )"
            >
                SHIPPED
            </button>

        `;
    }


    if (
        current !==
        "DELIVERED"
    ) {

        buttons += `

            <button
                class="action-btn"
                onclick="changeStatus(
                    '${escapeJS(
                        order.id
                    )}',
                    'DELIVERED'
                )"
            >
                DELIVERED
            </button>

        `;
    }


    if (
        current !==
        "CANCELLED"
    ) {

        buttons += `

            <button
                class="action-btn"
                onclick="changeStatus(
                    '${escapeJS(
                        order.id
                    )}',
                    'CANCELLED'
                )"
            >
                CANCEL
            </button>

        `;
    }


    return buttons;
}

/* =====================================================
   VISITOR CARD
===================================================== */

function createVisitorHTML(
    visitor
) {

    const visitorId =
        visitor.visitor_id ||
        "Visitor";


    const page =
        visitor.page ||
        "/";


    const userAgent =
        visitor.user_agent ||
        "";


    const lastSeen =
        visitor.last_seen ||
        visitor.created_at ||
        null;


    /* DEVICE */

    let device =
        "Desktop";


    if (
        /iPad|Tablet/i.test(
            userAgent
        )
    ) {

        device =
            "Tablet";

    } else if (
        /Mobile|Android|iPhone|iPod/i.test(
            userAgent
        )
    ) {

        device =
            "Mobile";
    }


    /* BROWSER */

    let browser =
        "Unknown";


    if (
        /Edg\//i.test(
            userAgent
        )
    ) {

        browser =
            "Microsoft Edge";

    } else if (
        /OPR\//i.test(
            userAgent
        )
    ) {

        browser =
            "Opera";

    } else if (
        /Chrome\//i.test(
            userAgent
        )
    ) {

        browser =
            "Google Chrome";

    } else if (
        /Firefox\//i.test(
            userAgent
        )
    ) {

        browser =
            "Mozilla Firefox";

    } else if (
        /Safari\//i.test(
            userAgent
        ) &&
        !/Chrome\//i.test(
            userAgent
        )
    ) {

        browser =
            "Safari";
    }


    /* LAST SEEN */

    let lastSeenText =
        "—";


    if (lastSeen) {

        const date =
            new Date(
                lastSeen
            );


        if (
            !Number.isNaN(
                date.getTime()
            )
        ) {

            lastSeenText =
                date.toLocaleString();
        }
    }


    /* ONLINE */

    let isOnline =
        false;


    if (lastSeen) {

        const time =
            new Date(
                lastSeen
            ).getTime();


        if (
            !Number.isNaN(
                time
            )
        ) {

            isOnline =
                Date.now() -
                time <=
                60000;
        }
    }


    const statusHTML =
        isOnline

            ? `
                <span class="visitor-status online">

                    <span class="online-dot"></span>

                    ONLINE

                </span>
              `

            : `
                <span class="visitor-status offline">
                    OFFLINE
                </span>
              `;


    return `

        <div class="visitor">

            <div class="visitor-top">

                <div class="visitor-title">

                    <span class="visitor-icon">
                        👤
                    </span>

                    <span class="visitor-id">

                        ${escapeHTML(
                            String(
                                visitorId
                            )
                        )}

                    </span>

                    ${statusHTML}

                </div>

            </div>


            <div class="visitor-details">


                <div class="detail">

                    <div class="detail-label">
                        PAGE
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            String(
                                page
                            )
                        )}

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        DEVICE
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            device
                        )}

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        BROWSER
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            browser
                        )}

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        LAST SEEN
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                            lastSeenText
                        )}

                    </div>

                </div>


            </div>

        </div>

    `;
}

/* =====================================================
   AUTO REFRESH
===================================================== */

let liveRefreshTimer =
    null;


function startLiveRefresh() {

    if (liveRefreshTimer) {

        clearInterval(
            liveRefreshTimer
        );
    }


    liveRefreshTimer =
        setInterval(
            async function() {

                if (!adminToken) {
                    return;
                }


                try {

                    await loadDashboard();


                    const activeTab =
                        document
                            .querySelector(
                                ".tab.active"
                            )
                            ?.dataset
                            .tab;


                    if (
                        activeTab ===
                        "orders"
                    ) {

                        await loadOrders();
                    }


                    if (
                        activeTab ===
                        "products"
                    ) {

                        await loadProducts();
                    }


                    if (
                        activeTab ===
                        "visitors"
                    ) {

                        await loadVisitors();
                    }


                    if (
                        activeTab ===
                        "carts"
                    ) {

                        await loadCarts();
                    }


                } catch(error) {

                    console.error(
                        "LIVE REFRESH ERROR:",
                        error
                    );

                }

            },
            10000
        );
}


/* =====================================================
   MONEY
===================================================== */

function formatMoney(
    amount
) {

    return (
        "Rs. " +
        Number(
            amount || 0
        ).toLocaleString(
            "en-PK"
        )
    );
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   JS ESCAPE
===================================================== */

function escapeJS(
    value
) {

    return String(
        value
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        );
}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    async function() {

        if (!adminToken) {

            showLogin();

            return;
        }


        try {

            await showAdmin();

            startLiveRefresh();


        } catch(error) {

            console.error(
                "ADMIN START ERROR:",
                error
            );


            showLogin();
        }

    }
);


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (adminToken) {

                refreshAll();

            }

        }

    }
);
