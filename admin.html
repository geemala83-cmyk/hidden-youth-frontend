<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hidden Youth — Admin Orders</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
        }

        .container {
            width: min(1200px, 94%);
            margin: 0 auto;
            padding: 30px 0 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 6px;
            color: #999;
            font-size: 14px;
        }

        .refresh-btn {
            border: 0;
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .refresh-btn:hover {
            opacity: 0.85;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 20px;
        }

        .stat-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #151515;
            border: 1px solid #292929;
            color: #aaa;
        }

        .orders {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .order {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 22px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .order-id {
            font-size: 18px;
            font-weight: 800;
        }

        .order-date {
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        .badge {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: #252525;
        }

        .customer {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .info {
            background: #101010;
            border-radius: 8px;
            padding: 12px;
        }

        .info-label {
            color: #777;
            font-size: 11px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 14px;
            word-break: break-word;
        }

        .items {
            border-top: 1px solid #292929;
            border-bottom: 1px solid #292929;
            padding: 15px 0;
            margin-bottom: 18px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
        }

        .item-name {
            font-weight: 700;
        }

        .item-meta {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        .item-price {
            font-weight: 700;
            white-space: nowrap;
        }

        .order-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .total {
            font-size: 20px;
            font-weight: 800;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid #444;
            background: #202020;
            color: #fff;
            padding: 9px 13px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .action-btn:hover {
            background: #303030;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 550px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .customer {
                grid-template-columns: 1fr;
            }

            .container {
                padding-top: 20px;
            }

            .brand {
                font-size: 22px;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <div class="brand">
                HIDDEN YOUTH
            </div>

            <div class="subtitle">
                Admin Order Management
            </div>
        </div>

        <button
            class="refresh-btn"
            onclick="loadOrders()"
        >
            ↻ REFRESH ORDERS
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-label">
                TOTAL ORDERS
            </div>

            <div
                class="stat-value"
                id="totalOrders"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                PENDING
            </div>

            <div
                class="stat-value"
                id="pendingOrders"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                CONFIRMED
            </div>

            <div
                class="stat-value"
                id="confirmedOrders"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                TOTAL SALES
            </div>

            <div
                class="stat-value"
                id="totalSales"
            >
                Rs. 0
            </div>
        </div>

    </div>


    <div
        class="status"
        id="statusMessage"
    >
        Loading orders...
    </div>


    <div
        class="orders"
        id="ordersContainer"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>


<script>

    /* =================================================
       BACKEND
    ================================================= */

    const API_URL =
        "https://hidden-youth-backend-production.up.railway.app";


    /* =================================================
       LOAD ORDERS
    ================================================= */

    async function loadOrders() {

        const statusMessage =
            document.getElementById(
                "statusMessage"
            );

        const container =
            document.getElementById(
                "ordersContainer"
            );

        statusMessage.textContent =
            "Loading orders...";

        container.innerHTML =
            '<div class="loading">Loading orders...</div>';


        try {

            const response =
                await fetch(
                    `${API_URL}/api/orders`
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load orders."
                );

            }


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.message ||
                    "Could not load orders."
                );

            }


            const orders =
                Array.isArray(data.orders)
                    ? data.orders
                    : [];


            updateStats(orders);

            renderOrders(orders);


            statusMessage.textContent =
                `Connected • ${orders.length} order(s) found.`;


        } catch (error) {

            console.error(
                "ADMIN ORDERS ERROR:",
                error
            );


            statusMessage.textContent =
                "Could not connect to backend.";


            container.innerHTML = `
                <div class="empty">
                    <h3>Backend Connection Failed</h3>

                    <p>
                        Please check the Railway backend.
                    </p>
                </div>
            `;

        }

    }


    /* =================================================
       UPDATE STATS
    ================================================= */

    function updateStats(orders) {

        const total =
            orders.length;


        const pending =
            orders.filter(
                order =>
                    order.status === "PENDING"
            ).length;


        const confirmed =
            orders.filter(
                order =>
                    order.status === "CONFIRMED"
            ).length;


        const sales =
            orders.reduce(
                (sum, order) =>
                    sum +
                    Number(order.total || 0),
                0
            );


        document.getElementById(
            "totalOrders"
        ).textContent =
            total;


        document.getElementById(
            "pendingOrders"
        ).textContent =
            pending;


        document.getElementById(
            "confirmedOrders"
        ).textContent =
            confirmed;


        document.getElementById(
            "totalSales"
        ).textContent =
            formatMoney(sales);

    }


    /* =================================================
       RENDER ORDERS
    ================================================= */

    function renderOrders(orders) {

        const container =
            document.getElementById(
                "ordersContainer"
            );


        if (!orders.length) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No Orders Yet</h3>
                    <p>
                        New customer orders will appear here.
                    </p>
                </div>
            `;

            return;

        }


        container.innerHTML =
            orders.map(
                order =>
                    createOrderHTML(order)
            ).join("");

    }


    /* =================================================
       ORDER HTML
    ================================================= */

    function createOrderHTML(order) {

        const customer =
            order.customer || {};


        const items =
            Array.isArray(order.items)
                ? order.items
                : [];


        const itemHTML =
            items.map(item => {

                const quantity =
                    Number(
                        item.quantity || 1
                    );


                const price =
                    Number(
                        item.price || 0
                    );


                return `
                    <div class="item">

                        <div>

                            <div class="item-name">
                                ${escapeHTML(
                                    item.name || "Product"
                                )}
                            </div>

                            <div class="item-meta">
                                Qty: ${quantity}
                                ×
                                ${formatMoney(price)}
                            </div>

                        </div>

                        <div class="item-price">
                            ${formatMoney(
                                price * quantity
                            )}
                        </div>

                    </div>
                `;

            }).join("");


        const date =
            order.createdAt
                ? new Date(
                    order.createdAt
                ).toLocaleString()
                : "—";


        return `
            <div class="order">

                <div class="order-top">

                    <div>

                        <div class="order-id">
                            ${escapeHTML(
                                order.id || "Unknown"
                            )}
                        </div>

                        <div class="order-date">
                            ${escapeHTML(date)}
                        </div>

                    </div>


                    <div class="badge">
                        ${escapeHTML(
                            order.status || "PENDING"
                        )}
                    </div>

                </div>


                <div class="customer">

                    <div class="info">

                        <div class="info-label">
                            Customer
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                customer.name || "—"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-label">
                            Phone
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                customer.phone || "—"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-label">
                            City
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                customer.city || "—"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-label">
                            Address
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                customer.address || "—"
                            )}
                        </div>

                    </div>

                </div>


                <div class="items">

                    ${itemHTML}

                </div>


                <div class="order-bottom">

                    <div class="total">
                        Total:
                        ${formatMoney(
                            Number(order.total || 0)
                        )}
                    </div>


                    <div class="actions">

                        ${createStatusButtons(order)}

                    </div>

                </div>

            </div>
        `;

    }


    /* =================================================
       STATUS BUTTONS
    ================================================= */

    function createStatusButtons(order) {

        const current =
            order.status || "PENDING";


        let buttons = "";


        if (current !== "CONFIRMED") {

            buttons += `
                <button
                    class="action-btn"
                    onclick="changeStatus(
                        '${escapeJS(order.id)}',
                        'CONFIRMED'
                    )"
                >
                    CONFIRM
                </button>
            `;

        }


        if (current !== "SHIPPED") {

            buttons += `
                <button
                    class="action-btn"
                    onclick="changeStatus(
                        '${escapeJS(order.id)}',
                        'SHIPPED'
                    )"
                >
                    SHIPPED
                </button>
            `;

        }


        if (current !== "DELIVERED") {

            buttons += `
                <button
                    class="action-btn"
                    onclick="changeStatus(
                        '${escapeJS(order.id)}',
                        'DELIVERED'
                    )"
                >
                    DELIVERED
                </button>
            `;

        }


        if (current !== "CANCELLED") {

            buttons += `
                <button
                    class="action-btn"
                    onclick="changeStatus(
                        '${escapeJS(order.id)}',
                        'CANCELLED'
                    )"
                >
                    CANCEL
                </button>
            `;

        }


        return buttons;

    }


    /* =================================================
       CHANGE ORDER STATUS
    ================================================= */

    async function changeStatus(
        orderId,
        newStatus
    ) {

        try {

            const response =
                await fetch(
                    `${API_URL}/api/orders/${encodeURIComponent(
                        orderId
                    )}/status`,
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            status: newStatus
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Could not update order."
                );

            }


            await loadOrders();


        } catch (error) {

            console.error(
                "STATUS UPDATE ERROR:",
                error
            );


            alert(
                "Could not update order status."
            );

        }

    }


    /* =================================================
       MONEY
    ================================================= */

    function formatMoney(amount) {

        return (
            "Rs. " +
            Number(amount || 0)
                .toLocaleString("en-PK")
        );

    }


    /* =================================================
       HTML ESCAPE
    ================================================= */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =================================================
       JS ESCAPE
    ================================================= */

    function escapeJS(value) {

        return String(value)
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/"/g, '\\"');

    }


    /* =================================================
       START
    ================================================= */

    loadOrders();

</script>

</body>
</html>
